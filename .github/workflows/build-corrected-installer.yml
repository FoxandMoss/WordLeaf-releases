name: Build corrected Wordleaf installer

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/build-corrected-installer.yml"
  workflow_dispatch:

concurrency:
  group: corrected-installer-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis --no-progress -y

      - name: Download current public Wordleaf payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/FoxandMoss/WordLeaf-releases/releases/download/v0.2.4/Wordleaf-Windows-Installer.exe"
          curl.exe -L --fail --retry 5 --retry-delay 2 -o "$env:RUNNER_TEMP\wordleaf-old.exe" $url
          if ($LASTEXITCODE -ne 0) { throw "Wordleaf payload download failed: $LASTEXITCODE" }

      - name: Stage current Wordleaf files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "C:\wordleaf-stage"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Extract the existing NSIS payload instead of running the old installer.
          # This avoids stale UI/startup behavior and is deterministic on a clean runner.
          $seven = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $seven) {
            choco install 7zip --no-progress -y
            $seven = (Get-Command 7z.exe -ErrorAction Stop).Source
          }
          & $seven x "$env:RUNNER_TEMP\wordleaf-old.exe" "-o$stage" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the current Wordleaf payload: $LASTEXITCODE" }

          $main = Get-ChildItem -Path $stage -Recurse -Filter "writer.exe" -File -ErrorAction SilentlyContinue |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1
          if (-not $main) { throw "Extracted Wordleaf payload did not contain wordleaf.exe" }

          $payload = $main.Directory.FullName
          if (!(Test-Path (Join-Path $payload "writer.exe"))) {
            throw "Wordleaf executable missing from extracted payload: $payload"
          }

          Remove-Item (Join-Path $payload "uninstall.exe") -Force -ErrorAction SilentlyContinue
          "STAGE_PAYLOAD=$payload" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using extracted Wordleaf payload: $payload"

      - name: Compile radio-drive installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) { $makensis = (Get-Command makensis.exe).Source }
          if (-not $env:STAGE_PAYLOAD) { throw "STAGE_PAYLOAD was not set" }
          & $makensis "/DSTAGEDIR=$env:STAGE_PAYLOAD" "installer\corrected.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          if (!(Test-Path "installer\Wordleaf_0.2.4.1_x64-setup.exe")) { throw "Corrected installer missing" }

      - name: Publish installer revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.2.4-installerfix1"
          if (-not (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null)) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target main --title "Wordleaf v0.2.4 installer fix 1" --notes "Wordleaf v0.2.4 payload with corrected drive-radio installer and retroactive cleanup for stale Wordleaf registrations."
          }
          New-Item -ItemType Directory -Force release-out | Out-Null
          Copy-Item "installer\Wordleaf_0.2.4.1_x64-setup.exe" "release-out\Wordleaf-Windows-Installer.exe"
          $sha=(Get-FileHash "release-out\Wordleaf-Windows-Installer.exe" -Algorithm SHA256).Hash.ToLower()
          "$sha  Wordleaf-Windows-Installer.exe" | Set-Content "release-out\Wordleaf-Windows-Installer.exe.sha256" -Encoding ascii
          gh release upload $tag "release-out\Wordleaf-Windows-Installer.exe" "release-out\Wordleaf-Windows-Installer.exe.sha256" --repo $env:GITHUB_REPOSITORY --clobber
          Write-Host "Published SHA256 $sha"

